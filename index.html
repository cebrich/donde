<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Puntos de Venta - Loterías</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #003366; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        select, input, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        textarea { height: 80px; resize: vertical; font-family: monospace; font-size: 12px; }
        button { background-color: #003366; color: white; font-weight: bold; margin-top: 15px; cursor: pointer; border: none; }
        button:hover { background-color: #002244; }
        .btn-secundario { background-color: #555; }
        .btn-secundario:hover { background-color: #333; }
        #log { margin-top: 20px; font-size: 14px; color: #555; white-space: pre-wrap; background: #eee; padding: 10px; border-radius: 4px; }
        hr { margin: 25px 0; border: 0; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    <h2>Buscador y Descarga de Puntos de Venta</h2>
    
    <!-- SECCIÓN PARA PEGAR EL CÓDIGO/JSON DE SORTEOS -->
    <label for="jsonInput">Pega aquí el texto/JSON de sorteos de la web original:</label>
    <textarea id="jsonInput" placeholder="Pega aquí la línea o estructura JSON con los sorteos..."></textarea>
    <button class="btn-secundario" onclick="cargarSorteosDesdeTexto()">Cargar Sorteos en el Selector</button>

    <hr>

    <label for="sorteoSelect">Selecciona el Sorteo:</label>
    <select id="sorteoSelect">
        <option value="">-- Primero pega los datos arriba y pulsa cargar --</option>
    </select>

    <label for="numeroInput">Número de Décimo (5 cifras):</label>
    <input type="text" id="numeroInput" maxlength="5" placeholder="Ej. 13648">

    <button onclick="descargarTxtPuntosDeVenta()">Generar y Descargar .txt</button>

    <div id="log">Estado: Esperando datos de sorteos...</div>
</div>

<script src="app.js"></script>
</body>
</html>
