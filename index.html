<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Puntos de Venta - Loterías</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #003366; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        select, input, button { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #003366; color: white; font-weight: bold; margin-top: 20px; cursor: pointer; border: none; }
        button:hover { background-color: #002244; }
        #log { margin-top: 20px; font-size: 14px; color: #555; white-space: pre-wrap; background: #eee; padding: 12px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Buscador y Descarga de Puntos de Venta</h2>
    
    <label for="sorteoSelect">Selecciona el Sorteo:</label>
    <select id="sorteoSelect">
        <option value="">Cargando sorteos actualizados...</option>
    </select>

    <label for="numeroInput">Número de Décimo (5 cifras):</label>
    <input type="text" id="numeroInput" maxlength="5" placeholder="Ej. 13648">

    <button onclick="descargarTxtPuntosDeVenta()">Generar y Descargar .txt</button>

    <div id="log">Estado: Listo para buscar.</div>
</div>

<script src="app.js"></script>
</body>
</html>
